services:
  api:
    build: .
    container_name: musicrecommender_api
    environment:
      - DB_SERVER=${DB_SERVER}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_DRIVER=${DB_DRIVER}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - API_V1_STR=${API_V1_STR}
      # Use host.docker.internal so the container can reach MinIO running on the host
      - AWS_S3_ENDPOINT_URL=http://host.docker.internal:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_S3_BUCKET=recommender-matrices
      - AWS_S3_PREFIX=recommendations
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    # Temporarily disabled restart policy to let the container stop on failure
    # restart: unless-stopped
  # `ui` service removed per request
  mlflow:
    image: python:3.12-slim
    container_name: musicrecommender_mlflow
    # Same "base image + command" pattern as the angular service below, instead of a
    # dedicated Dockerfile - reinstalls mlflow/boto3 on every fresh container start.
    command: sh -c "pip install --no-cache-dir mlflow boto3 && mlflow server --backend-store-uri sqlite:////mlflow/data/mlflow.db --default-artifact-root s3://recommender-matrices/mlflow-artifacts --host 0.0.0.0 --port 5000"
    environment:
      # Same MinIO bucket the API already uses (recommender-matrices), under its own
      # mlflow-artifacts/ prefix - not a separate bucket.
      - MLFLOW_S3_ENDPOINT_URL=http://host.docker.internal:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/data
  angular:
    image: node:18-alpine
    container_name: musicrecommender_angular
    working_dir: /app
    volumes:
      - ../MusicRecommender-UI:/app:rw
    ports:
      - "4200:4200"
    # Skip `npm ci` here because the host already has `node_modules` and a full reinstall can hang.
    command: sh -c "npm run start -- --host 0.0.0.0 --port 4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

volumes:
  mlflow_data:
